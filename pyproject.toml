[project]
name = "reonic-designer"
version = "0.1.0"
description = "Proposes PV / battery / heat pump designs for homes the way an expert planner would."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "streamlit>=1.40",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["matplotlib>=3.9"]  # charts for scripts/deviation_analysis.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
