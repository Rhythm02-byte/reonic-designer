[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engine"
version = "0.1.0"
description = "thinc! x Reonic design engine: ETL, policy baselines, API"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "pandas",
  "numpy",
  "pyarrow",
  "scikit-learn",
  "threadpoolctl",  # imported by the API (single-thread inference); also a scikit-learn dependency
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
